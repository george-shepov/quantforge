name: Deploy QuantForge main runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantforge-main-vps-deployment
  cancel-in-progress: true

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-main
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure main VPS SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust main VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish immutable source snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOYMENT_DIR: ${{ secrets.VPS_DEPLOYMENT_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${VPS_DEPLOYMENT_DIR:?VPS_DEPLOYMENT_DIR is required}"

          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -p "${VPS_PORT:-22}")
          release="$VPS_DEPLOYMENT_DIR/releases/$GITHUB_SHA"

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_DEPLOYMENT_DIR/releases'"

          tar --exclude-vcs --exclude='./.github' -czf - . | \
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; target='$release'; tmp='$VPS_DEPLOYMENT_DIR/.incoming-$GITHUB_SHA'; rm -rf \"\$tmp\" \"\$target\"; mkdir -p \"\$tmp\"; tar -xzf - -C \"\$tmp\"; mv \"\$tmp\" \"\$target\"; ln -sfn \"\$target\" '$VPS_DEPLOYMENT_DIR/current'"

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "find '$VPS_DEPLOYMENT_DIR/releases' -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf"

      - name: Deploy full QuantForge stack to main VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          QUANTFORGE_DEPLOY_DIR: ${{ secrets.QUANTFORGE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${QUANTFORGE_DEPLOY_DIR:?QUANTFORGE_DEPLOY_DIR is required}"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -p "${VPS_PORT:-22}")

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$QUANTFORGE_DEPLOY_DIR'"

          tar --exclude-vcs --exclude='./.github' -czf - . | \
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; tar -xzf - -C '$QUANTFORGE_DEPLOY_DIR'"

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "QUANTFORGE_DEPLOY_DIR='$QUANTFORGE_DEPLOY_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_DIR="$QUANTFORGE_DEPLOY_DIR"
          ENV_FILE="$DEPLOY_DIR/.env"
          cd "$DEPLOY_DIR"

          if [ ! -s "$ENV_FILE" ]; then
            umask 077
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > "$ENV_FILE"
            printf '%s\n' \
              'QUANTFORGE_ALLOW_NETWORK=true' \
              'QUANTFORGE_TESTNET_EXECUTION_ENABLED=false' \
              'QUANTFORGE_EXECUTION_NETWORK=disabled' \
              'QUANTFORGE_TESTNET_MAX_NOTIONAL=100' >> "$ENV_FILE"
          fi
          chmod 600 "$ENV_FILE"

          # The canonical VPS owns the full application stack. London-only Vault
          # agent prerequisites are intentionally not checked in this workflow.
          export QUANTFORGE_RUNTIME_ENV_FILE=/dev/null

          docker network inspect shepov_edge >/dev/null 2>&1 || docker network create shepov_edge
          docker compose -p quantforge up -d --build --remove-orphans
          docker compose -p quantforge exec -T api \
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/health')"
          docker exec quantforge_terminal wget -qO- http://127.0.0.1/api/health | grep -q quantforge-api
          REMOTE
