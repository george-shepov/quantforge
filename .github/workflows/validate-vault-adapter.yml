name: Validate Vault Adapter

on:
  pull_request:
    paths:
      - .github/workflows/deploy-source-to-vps.yml
      - .github/workflows/validate-vault-adapter.yml
      - .env.example
      - docker-compose.yml
      - scripts/refresh_vault_runtime_env.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse workflow YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path('.github/workflows/deploy-source-to-vps.yml'),
              Path('.github/workflows/validate-vault-adapter.yml'),
          ):
              payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or 'jobs' not in payload:
                  raise SystemExit(f'Invalid workflow structure: {path}')
          PY

      - name: Confirm vault migration and delivery gates
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/deploy-source-to-vps.yml
          grep -q 'VAULT_AGENT_CONFIG=/etc/quantforge/vault-agent/config' "$workflow"
          grep -q 'scripts/refresh_vault_runtime_env.py' "$workflow"
          grep -q -- '--destination "$VAULT_SSH_DEST"' "$workflow"
          grep -q -- '--output /run/quantforge/azure-storage.env' "$workflow"
          grep -q 'export QUANTFORGE_RUNTIME_ENV_FILE=/run/quantforge/azure-storage.env' "$workflow"
          grep -q 'chmod 600 "$ENV_FILE"' "$workflow"
          ! grep -q '/opt/shepov-vault/bin/import-legacy-app-secrets' "$workflow"
          ! grep -q 'retaining the existing mode-0600 QuantForge environment file' "$workflow"

      - name: Confirm Compose consumes only the generated runtime file
        run: |
          set -Eeuo pipefail
          grep -q '\${QUANTFORGE_RUNTIME_ENV_FILE:-/dev/null}' docker-compose.yml
          grep -q '^EXPECTED_ACCOUNT_NAME = "quantforgeukweststorage"' scripts/refresh_vault_runtime_env.py

      - name: Confirm current secret contract remains documented
        run: |
          set -Eeuo pipefail
          grep -q '^POSTGRES_PASSWORD=' .env.example
          grep -q '^QUANTFORGE_SAFETY_TOKEN=' .env.example
          grep -q '^HYPERLIQUID_TESTNET_PRIVATE_KEY=' .env.example
          grep -q '^HYPERLIQUID_TESTNET_ACCOUNT_ADDRESS=' .env.example
