server {
    listen 80;
    listen [::]:80;
    server_name eu.quantforge.giorgiy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eu.quantforge.giorgiy.org;

    ssl_certificate /etc/letsencrypt/live/eu.quantforge.giorgiy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu.quantforge.giorgiy.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/edge/health {
        proxy_pass http://127.0.0.1:8091/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/edge/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
