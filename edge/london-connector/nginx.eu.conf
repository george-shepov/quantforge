server {
    listen 80;
    listen [::]:80;
    server_name eu.quantforge.giorgiy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Friendly alias for the London machine. Keep HTTPS on the already-issued
# eu.quantforge.giorgiy.org certificate until london.giorgiy.org gets its own
# certificate; this still makes a bare HTTP request useful immediately.
server {
    listen 80;
    listen [::]:80;
    server_name london.giorgiy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 302 https://eu.quantforge.giorgiy.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eu.quantforge.giorgiy.org;

    ssl_certificate /etc/letsencrypt/live/eu.quantforge.giorgiy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu.quantforge.giorgiy.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/www/london.giorgiy.org/current;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "london-static-ok\n";
    }

    location = /api/edge/health {
        proxy_pass http://127.0.0.1:8091/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/edge/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:env|ini|log|sql|bak|backup|old|swp)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
